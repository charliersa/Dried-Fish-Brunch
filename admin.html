<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c5e7a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小魚乾後台" />
  <title>管理後台 - 小魚乾線上點餐系統</title>
  <style>
    /* 共用樣式由 shared.js 於頁尾注入 */
    .admin-card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 2px 6px rgba(28, 94, 122, .06);
      margin-bottom: 14px;
    }

    .admin-card h3 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 900;
    }

    .admin-cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 140px;
    }

    .bar-chart .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .bar-chart .bar {
      width: 100%;
      max-width: 34px;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, #6fb7d0, #3e9bd1);
      min-height: 2px;
      transition: height .3s ease;
    }

    .bar-val {
      font-size: 10px;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }

    .bar-label {
      font-size: 11px;
      color: #9db4bf;
      margin-top: 6px;
    }

    .rank-row {
      margin-bottom: 11px;
    }

    .rank-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .rank-head b {
      font-weight: 700;
    }

    .rank-track {
      background: #eef5f8;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .rank-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ec6398, #d84b84);
    }

    /* 顧客端在線人數（右上角即時徽章） */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef4f7;
      color: var(--ink-soft);
      font-weight: 900;
      font-size: 13px;
      padding: 5px 11px;
      border-radius: 999px;
    }

    .live-badge.on {
      background: var(--green-bg);
      color: var(--green);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b9cdd7;
    }

    .live-badge.on .live-dot {
      background: var(--green);
      animation: live-pulse 1.8s ease-out infinite;
    }

    @keyframes live-pulse {
      0% { box-shadow: 0 0 0 0 rgba(63, 168, 119, .55); }
      70% { box-shadow: 0 0 0 7px rgba(63, 168, 119, 0); }
      100% { box-shadow: 0 0 0 0 rgba(63, 168, 119, 0); }
    }

    .admin-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 2px;
    }

    .admin-tab {
      flex-shrink: 0;
      white-space: nowrap;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 999px;
    }

    .admin-tab.active {
      border: none;
      background: var(--ink);
      color: #fff;
    }

    .ent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      box-shadow: 0 2px 6px rgba(28, 94, 122, .05);
    }

    .ent-row.low {
      border: 1.5px solid #f2c4be;
    }

    .mini-btn {
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .add-btn {
      border: none;
      background: var(--pink);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
    }

    .hist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .hist-table th,
    .hist-table td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid #eef5f8;
    }

    .hist-table th {
      color: var(--ink-soft);
      font-size: 12px;
    }

    /* PIN 鎖畫面 */
    .pin-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 50, 65, .5);
      z-index: 60;
      display: flex;
      /* 內容比畫面高時（例如加價選項很多）要能捲動，不然按不到「儲存」 */
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    }

    .pin-box {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      margin: auto; /* 放得下時垂直置中，放不下時從最上面開始，才不會被切掉 */
      box-shadow: 0 12px 34px rgba(0, 0, 0, .22);
      text-align: center;
    }

    .pin-box input {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 6px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 18px;
      color: var(--ink);
      outline: none;
    }

    .pin-err {
      font-size: 13px;
      color: #e5534b;
      font-weight: 700;
      margin-top: 8px;
    }

    .pin-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .pin-actions button {
      flex: 1;
      cursor: pointer;
      font-weight: 900;
      padding: 11px;
      border-radius: 12px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="top-row">
        <div class="brand">
          <div class="brand-logo">🐟</div>
          <div class="brand-text">
            <h1>小魚乾早午餐</h1>
            <p>DRIED FISH BRUNCH</p>
          </div>
        </div>
        <div class="info-chip">⏰ 6:00–12:00</div>
      </div>
      <div class="address">📍 台南市東區長東街 106 號 · 現點現做，請耐心等候</div>
      <div class="nav-pills">
        <a href="customer.html">🍽️ 顧客點餐</a>
        <a href="kitchen.html">👨‍🍳 廚房後台</a>
        <a href="cashier.html">💰 外場收銀</a>
        <a href="display.html">📺 叫號螢幕</a>
        <a href="admin.html" style="background:#fff;color:var(--ink);">🔒 管理後台</a>
      </div>
    </header>
    <main id="app"></main>
  </div>

  <style>
    #print-area { display: none; }
    /* 螢幕上的列印預覽：先看再按「列印 / 另存 PDF」 */
    body.preview-open { overflow: hidden; }
    body.preview-open #print-area { display: block; position: fixed; inset: 0; z-index: 200; background: #fff; overflow: auto; padding: 0 24px 32px; }
    .rpt-toolbar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e3eef3; padding: 12px 0; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rpt-toolbar button { border: none; border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: 14px; cursor: pointer; }
    .rpt-toolbar .rpt-hint { font-size: 12px; color: #888; }
    #print-area .rpt-h1 { font-size: 22px; color: #1c5e7a; border-bottom: 3px solid #ec6398; padding-bottom: 6px; margin: 0 0 4px; }
    #print-area .rpt-h2 { font-size: 16px; color: #1c5e7a; border-left: 5px solid #ec6398; padding-left: 8px; margin: 16px 0 6px; }
    #print-area .rpt-sub { color: #666; margin-bottom: 8px; font-size: 12px; }
    #print-area table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
    #print-area th, #print-area td { border: 1px solid #999; padding: 5px 7px; text-align: left; vertical-align: top; }
    #print-area th { background: #eee; }
    @media print {
      body > .page, #toast { display: none !important; }
      body.preview-open { overflow: visible !important; }
      #print-area { display: block !important; position: static !important; padding: 0 !important; overflow: visible !important; }
      .rpt-toolbar { display: none !important; }
      @page { margin: 12mm; }
    }
  </style>
  <div id="print-area"></div>

  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="shared.js"></script>
  <script src="neworder-sound.js"></script>
  <script src="presence.js"></script>
  <script>document.head.insertAdjacentHTML('beforeend', '<style>' + getSharedStyles() + '</style>');</script>
  <script>
    const app = document.getElementById('app');
    let orders = loadOrders();
    let unlocked = false;

    // 管理後台登入：簡易密碼（登入狀態存 localStorage，登出清除）
    const ADMIN_PW = '2026';
    const ADMIN_AUTH_KEY = 'xyg-admin-auth';

    // 建立 品項id -> 分類 對照
    const ITEM_CAT = {};
    MENU.forEach(cat => cat.items.forEach(item => { ITEM_CAT[item.id] = cat; }));

    function renderStat(label, value, color) {
      return `
        <div class="stat-card">
          <div style="font-size:24px;font-weight:900;color:${color || 'var(--ink)'};">${value}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${label}</div>
        </div>
      `;
    }

    function renderLogin(errMsg) {
      app.innerHTML = `
        <div class="pin-overlay">
          <div class="pin-box">
            <div style="font-size:34px;">🔐</div>
            <h3 style="font-size:18px;font-weight:900;margin:6px 0 2px;">管理後台登入</h3>
            <div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">請輸入管理密碼</div>
            <input id="login-pw" type="password" inputmode="numeric" placeholder="密碼" autocomplete="current-password" style="text-align:left;letter-spacing:normal;" />
            <div id="login-err" class="pin-err" style="display:${errMsg ? 'block' : 'none'};">${errMsg || ''}</div>
            <div class="pin-actions">
              <a href="customer.html" style="flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:700;padding:11px;border-radius:12px;text-decoration:none;display:flex;align-items:center;justify-content:center;">返回</a>
              <button id="login-submit" style="background:var(--pink);color:#fff;">登入</button>
            </div>
          </div>
        </div>
      `;
      const pw = document.getElementById('login-pw');
      const btn = document.getElementById('login-submit');
      const submit = () => {
        if (pw.value === ADMIN_PW) {
          unlocked = true;
          try { localStorage.setItem(ADMIN_AUTH_KEY, '1'); } catch (e) {}
          renderAdmin();
        } else {
          renderLogin('密碼錯誤');
        }
      };
      btn.addEventListener('click', submit);
      pw.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      pw.focus();
    }

    function renderOffline() {
      app.innerHTML = `
        <div class="pin-overlay">
          <div class="pin-box">
            <div style="font-size:34px;">📡</div>
            <h3 style="font-size:18px;font-weight:900;margin:6px 0 2px;">需要連線</h3>
            <div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">管理後台需要連線並登入才能使用</div>
            <div class="pin-actions">
              <a href="customer.html" style="flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:700;padding:11px;border-radius:12px;text-decoration:none;display:flex;align-items:center;justify-content:center;">返回</a>
            </div>
          </div>
        </div>
      `;
    }

    function barChart(rows, fmt) {
      const max = Math.max(1, ...rows.map(r => r.value));
      return `<div class="bar-chart">${rows.map(r => `
        <div class="bar-col">
          <div class="bar-val">${fmt ? fmt(r.value) : r.value}</div>
          <div class="bar" style="height:${Math.round(r.value / max * 100)}%;"></div>
          <div class="bar-label">${r.label}</div>
        </div>`).join('')}</div>`;
    }

    function rankList(rows, fmt, emptyText) {
      if (rows.length === 0) {
        return `<div style="color:#9db4bf;font-size:14px;padding:10px 0;">${emptyText}</div>`;
      }
      const max = Math.max(1, ...rows.map(r => r.value));
      return rows.map(r => `
        <div class="rank-row">
          <div class="rank-head"><b>${escapeHtml(r.name)}</b><span style="color:var(--ink-soft);">${fmt(r.value)}</span></div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.round(r.value / max * 100)}%;"></div></div>
        </div>
      `).join('');
    }

    // ===== 管理後台狀態 =====
    let cfg = { menu: CURRENT_MENU, ent: JSON.parse(JSON.stringify(DEFAULT_ENT)) };
    let aTab = 'revenue';
    let editItem = null; // 菜單品項編輯
    let autoSaveStatus = ''; // '' | 'saving' | 'saved'（品項彈窗的自動儲存狀態）
    let entAutoStatus = ''; // 同上，營運資料彈窗（員工/食材/設備/成本）
    let editEnt = null;  // 員工/食材/設備/成本編輯
    let histScope = 'today';
    // 顧客端在線人數：presence.js 負責蒐集，這裡只管顯示
    // （心跳每 60 秒一次，人離開後最多 2.5 分鐘會從數字裡消失）
    let viewers = { total: 0, byPage: {} };

    let feedbacks = [];        // 顧客回饋清單（Firestore feedback 集合）
    let fbScope = 'all';       // 顧客回饋範圍：today / week / all
    let reportPeriod = 'day'; // 報表期間：day | week | month
    let annDraft = { text: '', type: 'info' }; // 公告新增表單的暫存（重繪時不會被清掉）
    let annEdit = null;        // 正在編輯的公告 { id, text, type }
    let addonList = [];        // 附加商品清單（Firestore config/addons 的 list 欄位）
    let addonLoaded = false;   // 雲端附加商品是否載入完成（沒載完不寫入，避免蓋掉既有資料）
    let addonSeeded = false;   // 目前畫面上的是「程式預設種子」而非雲端資料
    let addonEdit = null;      // 正在編輯的附加商品 { idx, id, name, img, active, options:[{id,label,price,orig}], isNew }
    let addonUploading = false; // 圖片正在上傳到 Cloudinary

    // ===== 圖片上傳（Cloudinary unsigned upload）=====
    // 瀏覽器不能放 API Secret，所以要用 Cloudinary 後台建立的「unsigned upload preset」。
    // 雲端名稱與 preset 存在 config/admin，店家可在「附加商品」分頁自行修改。
    const CLOUDINARY_DEFAULT_CLOUD = 'dbiirpmpy'; // 目前圖片所在的 Cloudinary 帳號
    const CLOUDINARY_FOLDER = 'fish-brunch';      // 上傳後放這個資料夾
    const CLOUDINARY_MAX_PX = 900;                // 上傳前先縮到最長邊 900px（省流量、顧客載得快）
    function cloudConf() {
      const c = cfg.cloudinary || {};
      return { cloud: (c.cloud || CLOUDINARY_DEFAULT_CLOUD).trim(), preset: (c.preset || '').trim() };
    }

    const ADMIN_TABS = [
      { k: 'revenue', label: '營收管理' }, { k: 'ops', label: '營運管理' }, { k: 'cost', label: '成本管理' },
      { k: 'payroll', label: '薪資管理' }, { k: 'ing', label: '食材管理' }, { k: 'equip', label: '設備管理' },
      { k: 'menu', label: '菜單管理' }, { k: 'addons', label: '附加商品' }, { k: 'history', label: '歷史訂單' },
      { k: 'feedback', label: '顧客回饋' }, { k: 'announce', label: '公告管理' },
    ];

    // 附加商品預設種子：雲端 config/addons 還沒有文件時，後台先顯示這些
    // （要跟顧客點餐頁 dried-fish-brunch-order-app/index.html 的 DEFAULT_ADDONS 一致）
    const DEFAULT_ADDONS = [
      { id: 'addon-milktea', name: '鮮乳',
        img: 'https://res.cloudinary.com/dbiirpmpy/image/upload/v1785163481/fish-brunch/Fresh_milk_tea.png',
        options: [{ id: 'bottle900', label: '900ml罐', price: 85, orig: 105 }] },
      { id: 'addon-radishcake', name: '手作蘿蔔糕',
        img: 'https://res.cloudinary.com/dbiirpmpy/image/upload/v1784949177/fish-brunch/Radish_cake_512.png',
        options: [{ id: 'whole', label: '1條', price: 230 }] },
    ];

    const money = n => '$' + (n || 0).toLocaleString();
    const fmtTime = ts => new Date(ts).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    const fmtDate = ts => new Date(ts).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
    const STATUS = {
      new: { label: '新訂單', color: '#E89A2B', bg: '#FCF1DC' },
      cook: { label: '製作中', color: '#3E9BD1', bg: '#E3F1FB' },
      done: { label: '完成', color: '#3FA877', bg: '#E1F4EA' },
    };
    const isPaid = o => !!(o.pay && o.pay.paid);
    const nameOf = it => it.name || (getItem(it.id) ? getItem(it.id).name : '(未知)');
    const priceOf = it => (it.price != null ? it.price : (getItem(it.id) ? getItem(it.id).price : 0));
    const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    // 預設 Google Sheet 同步網址（Apps Script Web App）；後台欄位有填則以欄位為準
    const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyou6DqfDLxPoScbyPWYfVzltXDtUO4MBlqO1pRcn6KITdyw6Q8chZNh7U-A0w9kY7s/exec';

    // 整理某一天的報表資料（訂單明細 + 金額合計 + 現金/行動分類 + 品項統計）
    function buildReportData(dateStr) {
      const day = orders.filter(o => dayKey(o.createdAt) === dateStr && !o.rejected).sort((a, b) => a.createdAt - b.createdAt);
      const paid = day.filter(isPaid);
      const cash = paid.filter(o => o.pay && o.pay.method === 'cash');
      const mobile = paid.filter(o => o.pay && o.pay.method === 'mobile');
      const sum = arr => arr.reduce((s, o) => s + (o.total || 0), 0);
      const stat = {};
      day.forEach(o => (o.items || []).forEach(it => { const n = nameOf(it); if (!stat[n]) stat[n] = { qty: 0, rev: 0 }; stat[n].qty += it.qty; stat[n].rev += priceOf(it) * it.qty; }));
      const items = Object.keys(stat).map(name => ({ name, qty: stat[name].qty, rev: stat[name].rev })).sort((a, b) => b.qty - a.qty);
      return { dateStr, day, count: day.length, paidCount: paid.length, revenue: sum(paid), cashCount: cash.length, cashSum: sum(cash), mobileCount: mobile.length, mobileSum: sum(mobile), unpaidCount: day.length - paid.length, items };
    }

    // ===== 訂單品項的加價選項（顧客點餐時選的「🥤換飲料／➕加購」）=====
    // 送單時也會寫進 note 開頭當備援；有結構化的 extras 就把它從備註拆出來單獨標示
    function itemExtras(it) { return Array.isArray(it.extras) ? it.extras.filter(e => e && e.name) : []; }
    function extrasLabel(ex) { return ex.map(e => (e.drink ? '換' : '＋') + e.name).join('、'); }
    function itemPureNote(it) {
      const ex = itemExtras(it), note = it.note || '';
      if (!ex.length) return note;
      const lab = extrasLabel(ex);
      if (note === lab) return '';
      return note.indexOf(lab + '、') === 0 ? note.slice(lab.length + 1) : note;
    }
    function extrasChips(it) {
      return itemExtras(it).map(e => {
        const isDrink = !!e.drink;
        return `<span style="display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:4px;background:${isDrink ? 'var(--blue-bg)' : 'var(--pink-bg)'};color:${isDrink ? 'var(--blue)' : 'var(--pink-deep)'};">${isDrink ? '🥤 換 ' : '➕ '}${escapeHtml(e.name)}${e.price ? ' +$' + e.price : ''}</span>`;
      }).join('');
    }
    // 純文字版（列印日報表、同步 Google Sheet 用）
    function orderItemsText(o) {
      return (o.items || []).map(it => {
        const ex = itemExtras(it), note = itemPureNote(it);
        return nameOf(it)
          + (it.temp ? '(' + it.temp + ')' : '')
          + (ex.length ? '(' + ex.map(e => (e.drink ? '換' : '＋') + e.name + '+$' + e.price).join('、') + ')' : '')
          + (note ? '[' + note + ']' : '')
          + '×' + it.qty;
      }).join('、');
    }
    // HTML 版（後台歷史訂單表格用）：加價／換飲料獨立標示，跟顧客備註分開
    function orderItemsHtml(o) {
      if (!(o.items || []).length) return '—';
      return (o.items || []).map(it => {
        const note = itemPureNote(it);
        return `<div style="margin-bottom:2px;">${escapeHtml(nameOf(it))}${it.temp ? '（' + escapeHtml(it.temp) + '）' : ''} ×${it.qty}${extrasChips(it)}${note ? `<span style="color:var(--amber);"> 📝${escapeHtml(note)}</span>` : ''}</div>`;
      }).join('');
    }
    const payText = o => (o.pay && o.pay.paid) ? (o.pay.method === 'cash' ? '現金' : '行動') : '未結';

    // 依日期＋期間（day/week/month）算出起訖與標題
    function periodRange(dateStr, period) {
      const p = dateStr.split('-').map(Number);
      const y = p[0], m = p[1], d = p[2];
      let start, end, label;
      if (period === 'week') {
        const dow = (new Date(y, m - 1, d).getDay() + 6) % 7; // 週一=0
        start = new Date(y, m - 1, d - dow);
        end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
        label = '週報　' + dayKey(start) + ' ～ ' + dayKey(end);
      } else if (period === 'month') {
        start = new Date(y, m - 1, 1);
        end = new Date(y, m, 0);
        label = '月報　' + y + '-' + String(m).padStart(2, '0');
      } else {
        start = new Date(y, m - 1, d);
        end = new Date(y, m - 1, d);
        label = '日報　' + dateStr;
      }
      start.setHours(0, 0, 0, 0); end.setHours(23, 59, 59, 999);
      return { start, end, label };
    }

    // 整理某一期間（日/週/月）的完整報表：營收/訂單/品項=真實歷史；成本/薪資/食材/設備=本月或目前快照
    function buildPeriodReport(dateStr, period) {
      const rg = periodRange(dateStr, period);
      const s = rg.start.getTime(), e = rg.end.getTime();
      const day = orders.filter(o => o.createdAt >= s && o.createdAt <= e && !o.rejected).sort((a, b) => a.createdAt - b.createdAt);
      const paid = day.filter(isPaid);
      const cash = paid.filter(o => o.pay && o.pay.method === 'cash');
      const mobile = paid.filter(o => o.pay && o.pay.method === 'mobile');
      const sum = arr => arr.reduce((acc, o) => acc + (o.total || 0), 0);
      const dineIn = day.filter(o => o.type === '內用').length;
      const takeout = day.length - dineIn;

      // 逐日明細
      const byDay = {};
      day.forEach(o => { const k = dayKey(o.createdAt); if (!byDay[k]) byDay[k] = { count: 0, revenue: 0, paidCount: 0 }; byDay[k].count++; if (isPaid(o)) { byDay[k].revenue += o.total || 0; byDay[k].paidCount++; } });
      const perDay = Object.keys(byDay).sort().map(k => ({ date: k, count: byDay[k].count, paidCount: byDay[k].paidCount, revenue: byDay[k].revenue }));

      // 品項統計
      const stat = {};
      day.forEach(o => (o.items || []).forEach(it => { const n = nameOf(it); if (!stat[n]) stat[n] = { qty: 0, rev: 0 }; stat[n].qty += it.qty; stat[n].rev += priceOf(it) * it.qty; }));
      const items = Object.keys(stat).map(n => ({ name: n, qty: stat[n].qty, rev: stat[n].rev })).sort((a, b) => b.qty - a.qty);

      // 分類營收（已結帳）
      const catMap = {};
      paid.forEach(o => (o.items || []).forEach(it => { const cn = catNameOf(it); catMap[cn] = (catMap[cn] || 0) + priceOf(it) * it.qty; }));
      const cats = Object.keys(catMap).map(n => ({ name: n, value: catMap[n] })).sort((a, b) => b.value - a.value);

      // 管理模組快照（本月／目前設定值）
      const ent = (cfg && cfg.ent) || {};
      const costs = ent.costs || [];
      const costTotal = costs.reduce((acc, c) => acc + (c.amount || 0), 0);
      const staffRows = (ent.staff || []).map(st => ({ name: st.name, role: st.role, wage: st.wage, hours: st.hours, pay: (st.wage || 0) * (st.hours || 0) }));
      const payrollTotal = staffRows.reduce((acc, r) => acc + r.pay, 0);
      const ingredients = ent.ingredients || [];
      const equipment = ent.equipment || [];
      const revenue = sum(paid);

      return {
        label: rg.label, period, start: rg.start, end: rg.end,
        count: day.length, paidCount: paid.length, unpaidCount: day.length - paid.length,
        revenue, cashCount: cash.length, cashSum: sum(cash), mobileCount: mobile.length, mobileSum: sum(mobile),
        dineIn, takeout, day, perDay, items, cats,
        costs, costTotal, staffRows, payrollTotal, ingredients, equipment,
        profit: revenue - costTotal - payrollTotal,
      };
    }

    // 營運報表預覽（日/週/月）：頁內預覽 → 列印或另存 PDF
    function printDayReport(dateStr) {
      if (!dateStr) { showMessage('請選擇日期'); return; }
      const r = buildPeriodReport(dateStr, reportPeriod);

      const perDayRows = r.perDay.length ? r.perDay.map(d => `<tr><td>${d.date}</td><td style="text-align:right">${d.count}</td><td style="text-align:right">${d.paidCount}</td><td style="text-align:right">$${d.revenue}</td></tr>`).join('') : '<tr><td colspan="4">本期間無訂單</td></tr>';
      const perDaySection = reportPeriod === 'day' ? '' : `

        <tr><th>合計</th><th style="text-align:right">${r.count}</th><th style="text-align:right">${r.paidCount}</th><th style="text-align:right">$${r.revenue}</th></tr></table>`;

      const itemRows = r.items.length ? r.items.map(it => `<tr><td>${escapeHtml(it.name)}</td><td style="text-align:right">${it.qty}</td><td style="text-align:right">$${it.rev}</td></tr>`).join('') : '<tr><td colspan="3">無</td></tr>';
      const catRows = r.cats.length ? r.cats.map(c => `<tr><td>${escapeHtml(c.name)}</td><td style="text-align:right">$${c.value}</td></tr>`).join('') : '<tr><td colspan="2">無</td></tr>';
      const orderRows = r.day.length ? r.day.map(o => `<tr><td>${escapeHtml(o.no)}</td><td>${reportPeriod === 'day' ? fmtTime(o.createdAt) : (fmtDate(o.createdAt) + ' ' + fmtTime(o.createdAt))}</td><td>${o.type} ${escapeHtml(o.table || '')}</td><td>${escapeHtml(orderItemsText(o))}</td><td>${payText(o)}</td><td style="text-align:right">$${o.total}</td></tr>`).join('') : '<tr><td colspan="6">本期間無訂單</td></tr>';

      const costRows = r.costs.length ? r.costs.map(c => `<tr><td>${escapeHtml(c.label)}</td><td style="text-align:right">$${c.amount}</td></tr>`).join('') : '<tr><td colspan="2">無</td></tr>';
      const staffRows = r.staffRows.length ? r.staffRows.map(s => `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.role || '')}</td><td style="text-align:right">$${s.wage}</td><td style="text-align:right">${s.hours}</td><td style="text-align:right">$${s.pay}</td></tr>`).join('') : '<tr><td colspan="5">無</td></tr>';
      const ingRows = r.ingredients.length ? r.ingredients.map(g => `<tr><td>${escapeHtml(g.name)}</td><td style="text-align:right">${g.stock} ${escapeHtml(g.unit || '')}</td><td style="text-align:right">${g.lowAt}</td><td>${(g.stock <= g.lowAt) ? '⚠️ 偏低' : '正常'}</td><td>${escapeHtml(g.supplier || '')}</td></tr>`).join('') : '<tr><td colspan="5">無</td></tr>';
      const eqRows = r.equipment.length ? r.equipment.map(q => `<tr><td>${escapeHtml(q.name)}</td><td>${escapeHtml(q.status || '')}</td><td>${escapeHtml(q.lastService || '')}</td></tr>`).join('') : '<tr><td colspan="3">無</td></tr>';

      const profitSection = `
        <div class="rpt-h2">簡易損益${isMonth ? '（月）' : ''}</div>
        <table>
          <tr><th>${periodWord}營收</th><td style="text-align:right">$${r.revenue}</td></tr>
          <tr><th>本月成本</th><td style="text-align:right">－$${r.costTotal}</td></tr>
          <tr><th>本月薪資</th><td style="text-align:right">－$${r.payrollTotal}</td></tr>
          <tr><th>結餘（營收－成本－薪資）</th><td style="text-align:right;font-weight:900;color:${r.profit >= 0 ? '#1c5e7a' : '#e5534b'};">$${r.profit}</td></tr>
          <tr><th>毛利率（結餘 ÷ 營收）</th><td style="text-align:right;font-weight:900;color:${r.profit >= 0 ? '#1c5e7a' : '#e5534b'};">${r.revenue > 0 ? Math.round(r.profit / r.revenue * 100) : 0}%</td></tr>
        </table>
        ${isMonth ? '' : '<div class="rpt-sub">※ 成本與薪資為「本月固定值」，與本期間營收相比僅供參考；損益建議看「月報」。</div>'}`;

      const area = document.getElementById('print-area');
      area.innerHTML = `
        <div class="rpt-toolbar">
          <button id="rpt-print" style="background:var(--pink);color:#fff;">🖨️ 列印 / 另存 PDF</button>
          <button id="rpt-close" style="background:#eef5f8;color:var(--ink);">✕ 關閉預覽</button>
          <span class="rpt-hint">在列印視窗的「目的地 / 印表機」選「<b>另存為 PDF</b>」即可存成 PDF 檔</span>
        </div>
        <div class="rpt-h1">🐟 小魚乾早午餐 · 營運報表</div>
        <div class="rpt-sub">${escapeHtml(r.label)}　列印時間：${fmtDate(Date.now())} ${fmtTime(Date.now())}</div>

        <div class="rpt-h2">營收摘要</div>${sumRows}
        ${perDaySection}
        <div class="rpt-h2">品項銷售統計</div><table><tr><th>品項</th><th style="text-align:right">數量</th><th style="text-align:right">小計</th></tr>${itemRows}</table>
        <div class="rpt-h2">分類營收</div><table><tr><th>分類</th><th style="text-align:right">營收</th></tr>${catRows}</table>
        <div class="rpt-h2">訂單明細</div><table><tr><th>取餐號</th><th>時間</th><th>類型/桌號</th><th>品項</th><th>付款</th><th style="text-align:right">金額</th></tr>${orderRows}</table>

        <div class="rpt-h2">成本（本月）</div><table><tr><th>項目</th><th style="text-align:right">金額</th></tr>${costRows}<tr><th>合計</th><th style="text-align:right">$${r.costTotal}</th></tr></table>
        <div class="rpt-h2">薪資（本月）</div><table><tr><th>姓名</th><th>職務</th><th style="text-align:right">時薪</th><th style="text-align:right">時數</th><th style="text-align:right">薪資</th></tr>${staffRows}<tr><th colspan="4">合計</th><th style="text-align:right">$${r.payrollTotal}</th></tr></table>
        ${profitSection}

        <div class="rpt-h2">食材庫存（目前）</div><table><tr><th>品名</th><th style="text-align:right">庫存</th><th style="text-align:right">安全量</th><th>狀態</th><th>供應商</th></tr>${ingRows}</table>
        <div class="rpt-h2">設備狀態（目前）</div><table><tr><th>設備</th><th>狀態</th><th>上次保養</th></tr>${eqRows}</table>`;
      document.body.classList.add('preview-open');
      window.scrollTo(0, 0);
      document.getElementById('rpt-print').addEventListener('click', () => window.print());
      document.getElementById('rpt-close').addEventListener('click', () => { document.body.classList.remove('preview-open'); area.innerHTML = ''; });
    }

    // 同步當日報表到 Google Sheet（Apps Script Web App）
    async function syncDayToSheet(dateStr) {
      if (!dateStr) { showMessage('請選擇日期'); return; }
      const url = ((cfg && cfg.sheetUrl) || DEFAULT_SHEET_URL || '').trim();
      if (!url) { showMessage('請先填寫並儲存 Google Sheet 連結網址'); return; }
      const r = buildReportData(dateStr);
      const payload = {
        date: dateStr, store: '小魚乾早午餐',
        summary: { count: r.count, paidCount: r.paidCount, unpaidCount: r.unpaidCount, revenue: r.revenue, cashCount: r.cashCount, cashSum: r.cashSum, mobileCount: r.mobileCount, mobileSum: r.mobileSum },
        orders: r.day.map(o => ({ no: o.no, time: fmtTime(o.createdAt), typeTable: o.type + ' · ' + (o.table || ''), status: (STATUS[o.status] || {}).label || o.status || '', pay: payText(o), total: o.total || 0 })),
        items: r.items
      };
      try {
        await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        showMessage('已送出到 Google Sheet，請到試算表確認 ✅');
      } catch (e) {
        showMessage('同步失敗：' + (e && e.message ? e.message : '請檢查網址'));
      }
    }
    function catNameOf(it) {
      for (const c of CURRENT_MENU) for (const i of c.items) if (i.id === it.id || i.name === it.name) return c.name;
      return '其他';
    }

    // ---------- 各分頁內容 ----------
    function tabRevenue() {
      const today = orders.filter(o => isToday(o.createdAt) && !o.rejected);
      const paid = today.filter(isPaid);
      const revenue = paid.reduce((s, o) => s + (o.total || 0), 0);
      const doneC = today.filter(o => o.status === 'done').length;
      const dineIn = today.filter(o => o.type === '內用').length;
      const takeout = today.length - dineIn;
      const cash = today.filter(o => o.pay && o.pay.paid && o.pay.method === 'cash').reduce((s, o) => s + o.total, 0);
      const mobile = today.filter(o => o.pay && o.pay.paid && o.pay.method === 'mobile').reduce((s, o) => s + o.total, 0);
      const unpaidOrders = today.filter(o => !isPaid(o));
      const unpaid = unpaidOrders.reduce((s, o) => s + (o.total || 0), 0);

      const catMap = {};
      paid.forEach(o => (o.items || []).forEach(it => {
        const cn = catNameOf(it);
        catMap[cn] = (catMap[cn] || 0) + priceOf(it) * it.qty;
      }));
      const catRows = Object.entries(catMap).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);

      const itemMap = {};
      today.forEach(o => (o.items || []).forEach(it => {
        const n = nameOf(it);
        itemMap[n] = (itemMap[n] || 0) + it.qty;
      }));
      const topRows = Object.entries(itemMap).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value).slice(0, 6);

      const now = new Date();
      const dayRows = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        const key = d.toDateString();
        const sum = orders.filter(o => isPaid(o) && new Date(o.createdAt).toDateString() === key).reduce((s, o) => s + (o.total || 0), 0);
        dayRows.push({ label: (d.getMonth() + 1) + '/' + d.getDate(), value: sum });
      }

      const payRows = [
        { name: '💵 現金', value: cash }, { name: '📱 行動支付', value: mobile }, { name: '⏳ 未結帳', value: unpaid },
      ].filter(r => r.value > 0);

      return `
        <div class="stats-grid">
          ${renderStat('今日訂單', today.length)}
          ${renderStat('已收營業額', '$' + revenue, 'var(--green)')}
          ${renderStat('已完成', doneC, 'var(--blue)')}
          ${renderStat('內用 / 外帶', dineIn + ' / ' + takeout, 'var(--pink)')}
        </div>
        ${unpaidOrders.length ? `
        <div class="admin-card">
          <h3>⏳ 待結帳明細（${unpaidOrders.length} 筆 · 共 $${unpaid}）</h3>
          ${unpaidOrders.map(o => `
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;">
              <div style="min-width:0;">
                <b style="color:var(--pink);font-size:15px;">${escapeHtml(String(o.no))}</b>
                <span style="color:var(--ink-soft);">　${o.type || ''} · ${escapeHtml(o.table || '')}${o.phone ? ' · 📞' + escapeHtml(o.phone) : ''}</span>
                <div style="margin-top:2px;">${(o.items || []).map(it => escapeHtml(nameOf(it)) + ' ×' + it.qty).join('、')}</div>
                ${o.note ? `<div style="color:var(--amber);">📝 ${escapeHtml(o.note)}</div>` : ''}
              </div>
              <b style="white-space:nowrap;font-size:15px;">$${o.total || 0}</b>
            </div>`).join('')}
        </div>` : ''}
        <div class="admin-card"><h3>近 7 日營收</h3>${barChart(dayRows, v => '$' + v)}</div>
        <div class="admin-cols">
          <div class="admin-card"><h3>付款方式分布</h3>${rankList(payRows, v => '$' + v, '今天還沒有銷售紀錄')}</div>
          <div class="admin-card"><h3>今日分類營收</h3>${rankList(catRows, v => '$' + v, '今天還沒有完成的訂單')}</div>
          <div class="admin-card"><h3>今日熱銷排行</h3>${rankList(topRows, v => v + ' 份', '今天還沒有銷售紀錄')}</div>
        </div>`;
    }

    function tabOps() {
      const today = orders.filter(o => isToday(o.createdAt));
      const totalT = today.length;
      const completion = totalT ? Math.round(today.filter(o => o.status === 'done').length / totalT * 100) : 0;
      const avgItems = totalT ? (today.reduce((s, o) => s + (o.items || []).reduce((a, i) => a + i.qty, 0), 0) / totalT) : 0;
      const doneOrders = today.filter(o => o.status === 'done' && o.updatedAt && o.updatedAt > o.createdAt);
      const avgPrep = doneOrders.length ? Math.round(doneOrders.reduce((s, o) => s + (o.updatedAt - o.createdAt), 0) / doneOrders.length / 60000) : 0;
      const dineIn = today.filter(o => o.type === '內用').length;
      const takeout = totalT - dineIn;
      const hrs = [6, 7, 8, 9, 10, 11, 12];
      const hc = {};
      today.forEach(o => { const h = new Date(o.createdAt).getHours(); hc[h] = (hc[h] || 0) + 1; });
      const hourRows = hrs.map(h => ({ label: h + '時', value: hc[h] || 0 }));

      return `
        <div class="stats-grid">
          ${renderStat('今日訂單', totalT)}
          ${renderStat('完成率', completion + '%', 'var(--green)')}
          ${renderStat('平均每單品項', avgItems.toFixed(1), 'var(--pink)')}
          ${renderStat('平均出餐時間', avgPrep + ' 分', 'var(--amber)')}
        </div>
        <div class="admin-card"><h3>營業時段分布（今日訂單數）</h3>${barChart(hourRows)}</div>
        <div class="admin-card"><h3>即時營運概況</h3>
          ${[
            { name: '內用 / 外帶', value: dineIn + ' / ' + takeout },
            { name: '製作中 / 待製作', value: today.filter(o => o.status === 'cook').length + ' / ' + today.filter(o => o.status === 'new').length },
          ].map(r => `<div class="ent-row"><span style="font-weight:700;">${r.name}</span><span style="font-weight:900;color:var(--ink-soft);">${r.value}</span></div>`).join('')}
        </div>`;
    }

    function tabCost() {
      const now = new Date();
      const payrollTotal = (cfg.ent.staff || []).reduce((a, s) => a + (s.wage || 0) * (s.hours || 0), 0);
      const costRows = [
        ...(cfg.ent.costs || []).map(c => ({ label: c.label, amount: c.amount || 0, id: c.id, auto: false })),
        { label: '人事薪資（自動）', amount: payrollTotal, id: '_pay', auto: true },
      ];
      const costTotal = costRows.reduce((a, c) => a + c.amount, 0);
      const sameMonth = ts => { const d = new Date(ts); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); };
      const monthOrders = orders.filter(o => isPaid(o) && sameMonth(o.createdAt));
      const monthRev = monthOrders.reduce((s, o) => s + (o.total || 0), 0);
      const monthCount = monthOrders.length;
      const profit = monthRev - costTotal;
      const margin = monthRev > 0 ? Math.round(profit / monthRev * 100) : 0; // 毛利率 %
      const avgOrder = monthCount ? Math.round(monthRev / monthCount) : 0;    // 客單價
      const avgProfit = monthCount ? Math.round(profit / monthCount) : 0;     // 平均每單利潤
      const maxCost = Math.max(1, ...costRows.map(c => c.amount));

      const bars = costRows.map(c => `
        <div class="rank-row">
          <div class="rank-head">
            <b>${escapeHtml(c.label)}</b>
            <span style="display:flex;align-items:center;gap:8px;color:var(--ink-soft);">
              ${money(c.amount)}
              ${c.auto ? '' : `<button class="mini-btn" data-action="ent-edit" data-kind="cost" data-id="${c.id}">編輯</button><button class="mini-btn" data-action="ent-del" data-kind="cost" data-id="${c.id}">🗑</button>`}
            </span>
          </div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.round(c.amount / maxCost * 100)}%;${c.auto ? 'background:linear-gradient(90deg,#6fb7d0,#3e9bd1);' : ''}"></div></div>
        </div>`).join('');

      return `
        <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
          ${renderStat('本月營收', money(monthRev), 'var(--green)')}
          ${renderStat('本月成本', money(costTotal), '#e5534b')}
          ${renderStat('本月毛利', money(profit), profit >= 0 ? 'var(--green)' : '#e5534b')}
          ${renderStat('毛利率', margin + '%', margin >= 0 ? 'var(--green)' : '#e5534b')}
        </div>
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
          ${renderStat('本月訂單數', monthCount)}
          ${renderStat('客單價', money(avgOrder), 'var(--blue)')}
          ${renderStat('平均每單利潤', money(avgProfit), avgProfit >= 0 ? 'var(--green)' : '#e5534b')}
        </div>
        <div class="admin-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <h3 style="margin:0;">本月成本明細</h3>
            <button class="add-btn" data-action="ent-add" data-kind="cost">＋ 新增成本</button>
          </div>
          ${bars}
        </div>`;
    }

      const rows = staff.map(s => `

      const today = orders.filter(o => isToday(o.createdAt));
      const pool = histScope === 'today' ? today : orders;
      const rev = pool.filter(isPaid).reduce((s, o) => s + (o.total || 0), 0);
      const list = pool.slice().sort((a, b) => b.createdAt - a.createdAt);
      const rowsHtml = list.map(o => {
        const st = o.rejected ? { label: '已拒單', color: '#e5534b', bg: '#fdecea' } : (STATUS[o.status] || STATUS.new);
        const pd = o.pay && o.pay.paid;
        const payLabel = o.rejected ? '—' : (pd ? (o.pay.method === 'cash' ? '💵 現金' : '📱 行動') : '未結');
        const when = histScope === 'today' ? fmtTime(o.createdAt) : (fmtDate(o.createdAt) + ' ' + fmtTime(o.createdAt));
        const itemsHtml = orderItemsHtml(o);
        return `<tr>
          <td style="font-weight:900;color:var(--pink);">${o.no}</td>
          <td>${when}</td>
          <td>${o.type} · ${escapeHtml(o.table || '')}</td>
          <td style="font-size:12px;color:var(--ink-soft);max-width:280px;white-space:normal;line-height:1.5;">${itemsHtml}${o.note ? `<div style="color:var(--amber);">📝 ${escapeHtml(o.note)}</div>` : ''}</td>
          <td><span class="badge" style="background:${st.bg};color:${st.color};">${st.label}</span></td>
          <td style="color:${pd ? '#3fa877' : '#9db4bf'};font-weight:700;">${payLabel}</td>
          <td style="font-weight:900;text-align:right;">$${o.total}</td>
          <td style="text-align:center;"><button class="mini-btn" data-action="hist-del" data-id="${o.id}" style="background:#fdecea;color:#e5534b;border:none;">🗑 刪除</button></td>
        </tr>`;
      }).join('');
      const tbtn = on => `border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;${on ? 'border:none;background:var(--ink);color:#fff;' : 'border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);'}`;
      return `
        <div class="admin-card" style="margin-bottom:14px;">
          <h3 style="margin:0 0 10px;">📑 營運報表（日／週／月）</h3>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <label style="font-size:13px;">日期</label>
            <input type="date" id="hist-date" value="${dayKey(Date.now())}" style="border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;">
            <div style="display:flex;gap:6px;">
              <button data-action="rpt-day" style="${tbtn(reportPeriod === 'day')}">日報</button>
              <button data-action="rpt-week" style="${tbtn(reportPeriod === 'week')}">週報</button>
              <button data-action="rpt-month" style="${tbtn(reportPeriod === 'month')}">月報</button>
            </div>
            <button class="add-btn" data-action="hist-print">🖨️ 列印 / 另存 PDF</button>
            <button class="add-btn" data-action="hist-sync">📊 同步到 Google Sheet</button>
          </div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">營收／訂單／品項為真實歷史資料；成本／薪資／食材／設備為本月或目前設定值快照。</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;">
            <label style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">Google Sheet 連結</label>
            <input id="sheet-url" placeholder="貼上 Apps Script Web App 網址" value="${escapeHtml(cfg.sheetUrl || DEFAULT_SHEET_URL)}" style="flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;">
            <button class="mini-btn" data-action="hist-save-sheet">儲存</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
          <div style="display:flex;gap:8px;">
            <button data-action="hist-today" style="${tbtn(histScope === 'today')}">今日</button>
            <button data-action="hist-all" style="${tbtn(histScope === 'all')}">全部</button>
          </div>
          <div style="font-size:14px;">營收：<b style="color:var(--green);">$${rev}</b> · 共 ${list.length} 筆</div>
        </div>
        <div class="admin-card">
          ${list.length ? `<table class="hist-table"><thead><tr><th>單號</th><th>時間</th><th>類型 / 桌號</th><th>品項</th><th>狀態</th><th>付款</th><th style="text-align:right;">金額</th><th style="text-align:center;">操作</th></tr></thead><tbody>${rowsHtml}</tbody></table>` : '<div style="color:#9db4bf;padding:10px 0;">沒有訂單紀錄</div>'}
        </div>`;
    }

    // ---------- 顧客回饋 ----------
    // 星等評分題（要跟 feedback.html 的 RATINGS 對齊）
    const FB_RATINGS = [
      { key: 'overall', label: '整體', icon: '⭐' },
      { key: 'taste',   label: '口味', icon: '😋' },
      { key: 'speed',   label: '速度', icon: '⏱️' },
      { key: 'service', label: '服務', icon: '🙋' },
      { key: 'clean',   label: '整潔', icon: '🧼' },
      { key: 'value',   label: '划算', icon: '💰' },
    ];
    const fbStars = n => { n = Math.round(n || 0); return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); };
    const fbWeekAgo = () => Date.now() - 7 * 24 * 60 * 60 * 1000;

    // ---------- 公告管理 ----------
    const ANN_TYPE_KEYS = ['info', 'warn', 'promo'];
    const ANN_TA_STYLE = 'width:100%;min-height:88px;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink);outline:none;box-sizing:border-box;resize:vertical;line-height:1.6;';
    function annList() { return Array.isArray(cfg.announcements) ? cfg.announcements : []; }
    // 寫回設定（跟菜單一樣：先更新本機鏡像 cfg，再整份存回雲端）
    function commitAnn(list) { cfg = Object.assign({}, cfg, { announcements: list }); saveConfig(cfg); }
    function annTypeChips(sel, action) {
      return ANN_TYPE_KEYS.map(k => {
        const s = ANNOUNCE_TYPES[k];
        return `<button class="mini-btn" data-action="${action}" data-type="${k}"${k === sel ? ` style="border:none;background:${s.line};color:#fff;"` : ''}>${s.icon} ${s.label}</button>`;
      }).join('');
    }

    function tabAnnounce() {
      const list = annList();
      const shown = list.filter(a => a.active !== false && String(a.text || '').trim()).length;

      const rows = list.map((a, i) => {
        if (annEdit && annEdit.id === a.id) {
          return `<div class="admin-card" style="border:1.5px solid var(--pink);margin-bottom:8px;">
            <textarea id="ann-edit-text" style="${ANN_TA_STYLE}">${escapeHtml(annEdit.text)}</textarea>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">${annTypeChips(annEdit.type, 'ann-edit-type')}</div>
            <div style="display:flex;gap:8px;margin-top:12px;">
              <button class="add-btn" data-action="ann-save">💾 儲存</button>
              <button class="mini-btn" data-action="ann-cancel">取消</button>
            </div>
          </div>`;
        }
        const s = announceStyle(a.type);
        const off = a.active === false;
        return `<div class="ent-row" style="border-left:4px solid ${s.line};${off ? 'opacity:.5;' : ''}">
          <div style="flex:1;min-width:200px;">
            <div style="font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:3px;">${s.icon} ${s.label}${off ? ' · 已隱藏' : ''}${a.createdAt ? ' · ' + fmtDate(a.createdAt) : ''}</div>
            <div style="font-size:14px;font-weight:700;line-height:1.6;word-break:break-word;">${escapeHtml(a.text).replace(/\n/g, '<br>')}</div>
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button class="mini-btn" data-action="ann-up" data-id="${escapeHtml(a.id)}"${i === 0 ? ' disabled style="opacity:.3;"' : ''}>↑</button>
            <button class="mini-btn" data-action="ann-down" data-id="${escapeHtml(a.id)}"${i === list.length - 1 ? ' disabled style="opacity:.3;"' : ''}>↓</button>
            <button class="mini-btn" data-action="ann-toggle" data-id="${escapeHtml(a.id)}">${off ? '👁 顯示' : '🚫 隱藏'}</button>
            <button class="mini-btn" data-action="ann-edit" data-id="${escapeHtml(a.id)}">✎ 編輯</button>
            <button class="mini-btn" data-action="ann-del" data-id="${escapeHtml(a.id)}" style="background:#fdecea;color:#e5534b;border:none;">🗑</button>
          </div>
        </div>`;
      }).join('');

      const preview = renderAnnouncementItems();

      return `
        <div class="admin-card">
          <h3>➕ 新增公告</h3>
          <textarea id="ann-text" placeholder="公告內容（可換行，例：本週六公休一天，敬請見諒）" style="${ANN_TA_STYLE}">${escapeHtml(annDraft.text)}</textarea>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;">
            <span style="font-size:13px;font-weight:700;color:var(--ink-soft);">類型</span>
            ${annTypeChips(annDraft.type, 'ann-type')}
          </div>
          <button class="add-btn" data-action="ann-add" style="margin-top:12px;">📢 新增公告</button>
          <p style="font-size:12px;color:var(--ink-soft);margin:10px 0 0;line-height:1.7;">
            新增後會立刻出現在<b>顧客手機點餐頁</b>與<b>店內點餐頁</b>的最上方。<br>
            不想刪掉但暫時不想顯示，按「🚫 隱藏」即可；之後要再用按「👁 顯示」。
          </p>
        </div>

        <div class="admin-card">
          <h3>目前公告 · 共 ${list.length} 則（顧客看得到 ${shown} 則）</h3>
          ${list.length ? rows : '<div style="color:#9db4bf;font-size:13px;">還沒有任何公告，用上面的欄位新增第一則吧</div>'}
        </div>

        <div class="admin-card">
          <h3>👀 顧客看到的樣子</h3>
          ${preview
            ? `<div style="max-width:400px;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(12,48,66,.18);">
                 <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(120deg,var(--ink-soft),#6fb7d0);color:#fff;">
                   <span style="font-size:15px;font-weight:900;letter-spacing:2px;">📌 店家公告</span>
                   <span style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:900;">✕</span>
                 </div>
                 <div style="padding:14px;background:#fff;">${preview}</div>
               </div>
               <p style="font-size:12px;color:var(--ink-soft);margin:10px 0 0;line-height:1.7;">
                 顧客點餐頁的標題列會出現「📢 店家公告」小按鈕（兩則以上會顯示數字），按下去就跳出上面這個懸浮視窗。
               </p>`
            : '<div style="color:#9db4bf;font-size:13px;">目前沒有顯示中的公告，顧客點餐頁不會出現公告按鈕</div>'}
        </div>
      `;
    }

    function tabFeedback() {
      const pool = (fbScope === 'today' ? feedbacks.filter(f => isToday(f.createdAt))
        : fbScope === 'week' ? feedbacks.filter(f => f.createdAt >= fbWeekAgo())
        : feedbacks).slice().sort((a, b) => b.createdAt - a.createdAt);
      const tbtn = on => `border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;${on ? 'border:none;background:var(--ink);color:#fff;' : 'border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);'}`;

      // 各面向平均分（只計有評分的）
      const avgOf = key => {
        const vals = pool.map(f => (f.ratings && f.ratings[key]) || 0).filter(v => v > 0);
        return vals.length ? (vals.reduce((s, v) => s + v, 0) / vals.length) : 0;
      };
      const overallAvg = avgOf('overall');

      // 最喜歡餐點統計（跨所有回饋累計）
      const favStat = {};
      pool.forEach(f => (f.favorites || []).forEach(n => { favStat[n] = (favStat[n] || 0) + 1; }));
      const favRank = Object.keys(favStat).map(name => ({ name, c: favStat[name] })).sort((a, b) => b.c - a.c);
      const favMax = favRank.length ? favRank[0].c : 0;

      // 再訪意願分佈
      const revStat = {};
      pool.forEach(f => { if (f.revisit) revStat[f.revisit] = (revStat[f.revisit] || 0) + 1; });

      const avgCards = FB_RATINGS.map(r => {
        const v = avgOf(r.key);
        return `<div class="stat-card">
          <div style="font-size:20px;font-weight:900;color:#f5b544;">${v ? v.toFixed(1) : '—'}<span style="font-size:12px;color:#dbe9f0;"> /5</span></div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${r.icon} ${r.label}</div>
        </div>`;
      }).join('');

      const favBars = favRank.length ? favRank.slice(0, 8).map(f => `
        <div class="rank-row">
          <div class="rank-head"><b>${escapeHtml(f.name)}</b><span style="color:var(--ink-soft);">${f.c} 票</span></div>
          <div class="rank-track"><div class="rank-fill" style="width:${favMax ? Math.round(f.c / favMax * 100) : 0}%;"></div></div>
        </div>`).join('') : '<div style="color:#9db4bf;">尚無資料</div>';

      const revChips = Object.keys(revStat).length
        ? Object.keys(revStat).sort((a, b) => revStat[b] - revStat[a]).map(k =>
            `<span class="badge" style="background:var(--pink-bg);color:var(--pink-deep);">${escapeHtml(k)} · ${revStat[k]}</span>`).join(' ')
        : '<span style="color:#9db4bf;">尚無資料</span>';

      const rowsHtml = pool.map(f => {
        const when = fmtDate(f.createdAt) + ' ' + fmtTime(f.createdAt);
        const ratingCells = FB_RATINGS.map(r => {
          const v = (f.ratings && f.ratings[r.key]) || 0;
          return `<div title="${r.label}" style="font-size:12px;white-space:nowrap;"><span style="color:var(--ink-soft);">${r.icon}</span> <span style="color:#f5b544;">${v ? fbStars(v) : '—'}</span></div>`;
        }).join('');
        return `<tr>
          <td style="white-space:nowrap;">${when}</td>
          <td style="min-width:180px;">${ratingCells}</td>
          <td style="font-size:12px;color:var(--ink-soft);max-width:220px;white-space:normal;line-height:1.5;">${(f.favorites && f.favorites.length) ? '🍽️ ' + escapeHtml(f.favorites.join('、')) : ''}${f.revisit ? `<div>💗 ${escapeHtml(f.revisit)}</div>` : ''}</td>
          <td style="font-size:13px;max-width:300px;white-space:normal;line-height:1.6;">${f.comment ? escapeHtml(f.comment) : '<span style="color:#c8d6dd;">（無留言）</span>'}</td>
          <td style="white-space:nowrap;font-size:13px;">${f.phone ? '📞 ' + escapeHtml(f.phone) : '<span style="color:#c8d6dd;">—</span>'}</td>
          <td style="text-align:center;"><button class="mini-btn" data-action="fb-del" data-id="${escapeHtml(f.id)}" style="background:#fdecea;color:#e5534b;border:none;">🗑</button></td>
        </tr>`;
      }).join('');

      return `
        <div class="admin-cols" style="margin-bottom:14px;">
          <div class="admin-card" style="text-align:center;">
            <h3 style="margin:0 0 8px;">整體滿意度</h3>
            <div style="font-size:44px;font-weight:900;color:#f5b544;line-height:1;">${overallAvg ? overallAvg.toFixed(1) : '—'}<span style="font-size:16px;color:#dbe9f0;"> /5</span></div>
            <div style="font-size:24px;color:#f5b544;letter-spacing:3px;margin-top:4px;">${overallAvg ? fbStars(overallAvg) : '☆☆☆☆☆'}</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">共 ${pool.length} 份回饋</div>
          </div>
          <div class="admin-card">
            <h3 style="margin:0 0 10px;">各面向平均</h3>
            <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:0;">${avgCards}</div>
          </div>
        </div>
        <div class="admin-cols" style="margin-bottom:14px;">
          <div class="admin-card">
            <h3 style="margin:0 0 12px;">🍽️ 最受歡迎餐點</h3>
            ${favBars}
          </div>
          <div class="admin-card">
            <h3 style="margin:0 0 12px;">💗 再訪／推薦意願</h3>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">${revChips}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
          <div style="display:flex;gap:8px;">
            <button data-action="fb-today" style="${tbtn(fbScope === 'today')}">今日</button>
            <button data-action="fb-week" style="${tbtn(fbScope === 'week')}">近 7 天</button>
            <button data-action="fb-all" style="${tbtn(fbScope === 'all')}">全部</button>
          </div>
          <div style="font-size:14px;">共 <b style="color:var(--pink-deep);">${pool.length}</b> 份留言</div>
        </div>
        <div class="admin-card">
          ${pool.length ? `<div style="overflow-x:auto;"><table class="hist-table"><thead><tr><th>時間</th><th>評分</th><th>喜好 / 意願</th><th>留言</th><th>手機</th><th style="text-align:center;">操作</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>` : '<div style="color:#9db4bf;padding:10px 0;">目前還沒有顧客回饋。顧客可從點餐頁上方的「💬 點餐回饋表單」填寫。</div>'}
        </div>`;
    }

    // ---------- 編輯彈窗 ----------
    function fieldDefs(kind) {
      if (kind === 'staff') return [{ key: 'name', label: '姓名', type: 'text' }, { key: 'role', label: '職務', type: 'text' }, { key: 'wage', label: '時薪', type: 'number' }, { key: 'hours', label: '本月時數', type: 'number' }];
      if (kind === 'ingredient') return [{ key: 'name', label: '品名', type: 'text' }, { key: 'unit', label: '單位', type: 'text' }, { key: 'stock', label: '目前庫存', type: 'number' }, { key: 'lowAt', label: '安全庫存', type: 'number' }, { key: 'supplier', label: '供應商', type: 'text' }];
      if (kind === 'equipment') return [{ key: 'name', label: '設備名稱', type: 'text' }, { key: 'lastService', label: '上次保養（例 2026/06/01）', type: 'text' }];
      if (kind === 'cost') return [{ key: 'label', label: '成本項目', type: 'text' }, { key: 'amount', label: '本月金額', type: 'number' }];
      return [];
    }
    const entListKey = kind => kind === 'staff' ? 'staff' : kind === 'ingredient' ? 'ingredients' : kind === 'equipment' ? 'equipment' : 'costs';

    function renderModals() {
      let html = '';
      if (editItem) {
        html += `
          <div class="pin-overlay"><div class="pin-box" style="max-width:320px;">
            <h3 style="font-size:17px;font-weight:900;margin:0 0 14px;">${editItem.isNew ? '新增品項' : '編輯品項'}</h3>
            <input id="item-name" placeholder="品名" value="${escapeHtml(editItem.name || '')}" style="text-align:left;letter-spacing:normal;margin-bottom:8px;" />
            <input id="item-price" type="number" placeholder="價格" value="${editItem.price != null ? editItem.price : ''}" style="text-align:left;letter-spacing:normal;" />
            <textarea id="item-opts" placeholder="備註選項（一行一個，例：&#10;不要沙拉&#10;不要蕃茄醬）" style="width:100%;min-height:96px;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink);outline:none;box-sizing:border-box;resize:vertical;text-align:left;letter-spacing:normal;">${escapeHtml(editItem.opts || '')}</textarea>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;text-align:left;">顧客點此品項時可一鍵勾選；留空則用該分類預設選項。</div>
            <div style="margin-top:12px;text-align:left;">
              <input id="item-basedrink" placeholder="套餐內含飲料（例：紅茶；非套餐請留空）" value="${escapeHtml(editItem.baseDrink || '')}" list="admin-drink-list" style="text-align:left;letter-spacing:normal;margin:0 0 4px;" />
              <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">有填的話，顧客點餐頁會顯示「套餐附 紅茶」，並可用下面的🥤選項加價更換。</div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
                <div style="font-size:12px;color:var(--ink-soft);font-weight:700;">💰 加價選項（顧客點餐時可加選，會計入總價）</div>
                <button class="mini-btn" data-action="addon-add" style="flex:none;">＋ 新增</button>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
                <span style="font-size:12px;color:var(--ink-soft);">一鍵加入換飲料：</span>
                ${DRINK_PRESETS.map(p => `<button class="mini-btn" data-action="addon-preset" data-name="${escapeHtml(p.name)}" data-price="${p.price}" style="flex:none;border-color:var(--blue);color:var(--blue);">🥤 +${p.price} ${escapeHtml(p.name)}</button>`).join('')}
              </div>
              ${(editItem.addons || []).length ? (editItem.addons || []).map((ad, i) => `

    // ---------- 顧客端在線人數 ----------
    function viewersHtml() {
      const n = viewers.total;
      const names = Object.keys(viewers.byPage);
      const detail = names.length
        ? names.map(k => `${k} ${viewers.byPage[k]} 人`).join('、')
        : '目前沒有人在點餐頁面';
      return `<span class="live-badge${n ? ' on' : ''}" title="${detail}"><span class="live-dot"></span>👀 ${n} 人在看</span>`;
    }

    // 只換徽章本身，不重繪整個後台（避免每 15 秒把畫面重建一次）
    function paintViewers() {
      const el = document.getElementById('live-viewers');
      if (el) el.innerHTML = viewersHtml();
    }

    // ---------- 新訂單提示音（跟廚房後台同一套做法）----------
    // 顧客手機／店內點餐送出後，這台後台要響鈴提醒
    let soundEnabled = true;
    try { soundEnabled = localStorage.getItem('xyg-admin-sound') !== 'off'; } catch (e) {}
    // 提示音音檔（HTMLAudio，相容性最高）；使用者在本頁互動一次即解鎖，之後可自動播放
    const _alertAudio = new Audio(window.ALERT_SOUND_URI || '');
    _alertAudio.preload = 'auto';
    // 音訊是否真的已解鎖（瀏覽器自動播放封鎖）；沒解鎖的話新訂單不會有聲音
    let _audioReady = false;
    function _markAudioReady(v) {
      if (_audioReady === v) return;
      _audioReady = v;
      paintSound();
    }
    function _unlockAudio() {
      if (!_alertAudio.paused) return; // 鈴聲正在播的時候不做測試，避免把鈴聲切斷
      try {
        _alertAudio.muted = true; _alertAudio.volume = 0;
        const p = _alertAudio.play();
        if (p && p.then) p.then(() => {
          _alertAudio.pause(); _alertAudio.currentTime = 0; _alertAudio.volume = 1; _alertAudio.muted = false;
          _markAudioReady(true); // 真的播得出來才算解鎖
        }).catch(() => { _alertAudio.volume = 1; _alertAudio.muted = false; });
      } catch (e) { _alertAudio.volume = 1; _alertAudio.muted = false; }
      if (!_bpDone) { _bpDone = true; registerBackendPush(); } // 首次互動時註冊後端推播（關網頁也收得到新單）
    }
    document.addEventListener('touchend', _unlockAudio, { passive: true });
    document.addEventListener('click', _unlockAudio, { passive: true });
    // 盡力自動啟用：載入與回到前景時先試著解鎖（環境允許就直接生效、紅色提示不會出現；
    // 被瀏覽器擋下也無妨，碰螢幕任一處會立刻解鎖）
    setTimeout(_unlockAudio, 400);
    window.addEventListener('pageshow', _unlockAudio);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) _unlockAudio(); });

    // ---------- 關店通知（FCM 後端推播；網頁關著也收得到新單）----------
    // 顧客送出訂單 → 顧客端呼叫 push-server 的 notify-backend → 推播給 backendTokens 裡所有裝置
    let _bpDone = false;
    let _pushState = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported'; // granted/denied/default/unsupported
    // 註冊本裝置為「後端推播接收者」：授權通知→取得 token→存進 backendTokens
    // interactive=true（手動點按鈕）或首次授權成功時，會跳確認視窗
    async function registerBackendPush(interactive) {
      try {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) { if (interactive) alert('此裝置或瀏覽器不支援通知'); return; }
        if (typeof firebase === 'undefined' || typeof firebase.messaging !== 'function') return;
        if (typeof PUSH_CONFIG === 'undefined' || !PUSH_CONFIG.vapidKey || PUSH_CONFIG.vapidKey.indexOf('PASTE') !== -1) return;
        const before = Notification.permission;
        let perm = before;
        if (perm === 'default') perm = await Notification.requestPermission();
        _pushState = perm; paintSound();
        if (perm !== 'granted') { if (interactive) alert('⚠️ 尚未允許通知，關店時不會收到推播。\n可到裝置「設定 → 通知」開啟本 App 的通知。'); return; }
        const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm-scope/' });
        const token = await firebase.messaging().getToken({ vapidKey: PUSH_CONFIG.vapidKey, serviceWorkerRegistration: reg });
        if (!token) { if (interactive) alert('取得推播失敗，請重試'); return; }
        let bid;
        try { bid = localStorage.getItem('xyg-backend-id'); if (!bid) { bid = 'bk' + Date.now() + Math.floor(Math.random() * 1000); localStorage.setItem('xyg-backend-id', bid); } } catch (e) { bid = token.slice(-24); }
        await firebase.firestore().collection('backendTokens').doc(bid).set({ token, updatedAt: Date.now() });
        // 前景推播＝「有新單」的即時鬧鐘：推播走 Apple 通道不經店內資料連線，
        // 收到的瞬間立刻直連同步一次，資料連線再慢也拖不住響鈴
        try { firebase.messaging().onMessage(function () { try { restPollOrders(); } catch (e) {} }); } catch (e) {}
        _pushState = 'granted'; paintSound();
        if (before !== 'granted' || interactive) alert('✅ 關店通知已開啟！\n顧客下單時，即使這台網頁關著也會跳通知＋響。');
      } catch (e) { if (interactive) alert('設定失敗：' + ((e && e.message) || e)); console.warn('後端推播註冊略過', e); }
    }

    function playNewOrderSound() {
      try {
        if (window.ALERT_SOUND_URI) {
          _alertAudio.currentTime = 0;
          _alertAudio.volume = 1; _alertAudio.muted = false;
          const p = _alertAudio.play();
          if (p) {
            if (p.then) p.then(() => _markAudioReady(true));
            // 播不出來 → 標記未解鎖（畫面會跳出警告按鈕）
            if (p.catch) p.catch(() => _markAudioReady(false));
          }
        }
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 200]);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      try { localStorage.setItem('xyg-admin-sound', soundEnabled ? 'on' : 'off'); } catch (e) {}
      if (soundEnabled) { _unlockAudio(); playNewOrderSound(); } // 開啟時試響一聲並解鎖音訊
      paintSound();
    }

    function soundHtml() {
      return `<button class="pill-button" data-action="toggle-sound" style="cursor:pointer;padding:5px 11px;font-size:13px;">${soundEnabled ? '🔔 新單提示音：開' : '🔕 新單提示音：關'}</button>`
        + ((soundEnabled && !_audioReady) ? `<button class="pill-button" data-action="enable-sound" style="cursor:pointer;padding:5px 11px;font-size:13px;border-color:#e05252;color:#e05252;font-weight:900;">⚠️ 提示音未啟用 — 點我測試</button>` : '')
        + `<button class="pill-button" data-action="enable-push" title="開啟後，關掉這個網頁也會收到新訂單通知" style="cursor:pointer;padding:5px 11px;font-size:13px;${_pushState === 'granted' ? 'border-color:#3fa877;color:#3fa877;' : 'border-color:#e89a2b;color:#e89a2b;'}">${_pushState === 'granted' ? '✅ 關店通知：開' : '🔔 開啟關店通知'}</button>`;
    }

    // 只換這一小塊，不重繪整個後台（編輯彈窗開著時整頁重繪會打斷輸入）
    function paintSound() {
      const el = document.getElementById('sound-ctrl');
      if (!el) return;
      el.innerHTML = soundHtml();
      el.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => handleAction(b)));
    }

    // 偵測是否有新的「新訂單」進來（首次同步不響，避免開後台時把既有訂單全部當成新單）
    let _knownIds = null;
    function checkNewOrders(list) {
      const ids = new Set(list.map(o => o.id));
      if (_knownIds === null) { _knownIds = ids; return; } // 第一次載入：只記錄不響
      const hasNew = list.some(o => !_knownIds.has(o.id) && o.status === 'new' && !o.rejected);
      _knownIds = ids;
      if (hasNew && soundEnabled) playNewOrderSound();
      if (hasNew && !_jumpTimer) {
        // 店主在後台看報表/改菜單時進了新單 → 先響鈴提示，1.5 秒後自動跳到廚房後台，避免漏單
        // （後台的編輯都會自動儲存，跳走不會遺失資料）
        showMessage('🔔 有新訂單！正在前往廚房後台…');
        _jumpTimer = setTimeout(() => { location.href = 'kitchen.html'; }, 1500);
      }
    }
    let _jumpTimer = null; // 新單自動跳轉計時器（防重複觸發）

    // 連不上雲端時畫面只剩這台裝置的本機備份 → 講清楚紀錄還在，別讓人以為被刪了
    function offlineNoticeHtml() {
      if (typeof SYNC === 'undefined' || SYNC.mode === 'cloud') return '';
      // 開頁寬限期：載入頭 8 秒連線還在握手，先不要跳「連不上雲端」（會嚇人又馬上消失）
      if (typeof NET !== 'undefined' && NET.bootAt && Date.now() - NET.bootAt < 8000) return '';
      return `<div style="background:#fdf3e3;border:1px solid #f0d59b;color:#8a5b12;border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:13px;line-height:1.7;">
        🔄 <b>目前連不上雲端</b>，以下顯示的是這台裝置的本機備份（${orders.length} 筆訂單）。<br>
        雲端上的歷史訂單與營收紀錄不會因此消失，網路恢復後重新整理就會回來。
      </div>`;
    }

    // ---------- 主渲染 ----------
    function renderAdmin() {
      // 記住捲動位置：整頁垂直 + 分頁橫桿(.admin-tabs)的橫向捲動，重建 DOM 後還原，避免點擊後跳回最前面
      const _scrollY = window.scrollY;
      const _tabsBar = app.querySelector('.admin-tabs');
      const _tabsLeft = _tabsBar ? _tabsBar.scrollLeft : 0;
      // 記住焦點欄位與游標位置：自動儲存會觸發雲端快照而重繪，
      // 沒有還原的話打字打到一半游標會跳掉
      const _act = document.activeElement;
      const _focusId = _act && _act.id ? _act.id : null;
      const _caret = _act && typeof _act.selectionStart === 'number' ? _act.selectionStart : null;
      const bodyFns = { revenue: tabRevenue, ops: tabOps, cost: tabCost, payroll: tabPayroll, ing: tabIng, equip: tabEquip, menu: tabMenu, addons: tabAddons, history: tabHistory, feedback: tabFeedback, announce: tabAnnounce };
      app.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);">
            <span>📊 ${syncModeLabel()} · 自動更新</span>
            <span id="live-viewers">${viewersHtml()}</span>
            <span id="sound-ctrl" style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;">${soundHtml()}</span>
          </div>
          <button id="logout-btn" class="pill-button">🔓 登出</button>
        </div>
        ${offlineNoticeHtml()}
        <div class="admin-tabs">${ADMIN_TABS.map(t => `<button class="admin-tab${t.k === aTab ? ' active' : ''}" data-tab="${t.k}">${t.label}</button>`).join('')}</div>
        ${(bodyFns[aTab] || tabRevenue)()}
        ${renderModals()}
      `;
      bindAdmin();
      const _newTabsBar = app.querySelector('.admin-tabs');
      if (_newTabsBar) _newTabsBar.scrollLeft = _tabsLeft;
      window.scrollTo(0, _scrollY);
      if (_focusId) {
        const el = document.getElementById(_focusId);
        if (el) {
          el.focus();
          if (_caret != null && typeof el.setSelectionRange === 'function') {
            try { el.setSelectionRange(_caret, _caret); } catch (e) {}

    function bindAdmin() {
      const logout = document.getElementById('logout-btn');
      if (logout) logout.addEventListener('click', () => { unlocked = false; try { localStorage.removeItem(ADMIN_AUTH_KEY); } catch (e) {} renderLogin(); });
      app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { aTab = b.dataset.tab; renderAdmin(); }));
      app.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => handleAction(b)));
      // 營運資料彈窗（員工/食材/設備/成本）：欄位變動即排程自動儲存
      if (editEnt) {
        fieldDefs(editEnt.kind).forEach(d => {
          const el = document.getElementById('ent-' + d.key);
          if (el) el.addEventListener('input', scheduleEntAutoSave);
        });
      }
      // 結單時間與開關：改完立刻存（下拉/勾選不需要延遲）
      ['close-time', 'close-enabled'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', () => {
          if (!isConfigLoaded()) { showMessage('⚠️ 雲端資料尚未載入完成，請稍候再操作'); return; }
          const t = document.getElementById('close-time'), en = document.getElementById('close-enabled');
          cfg = Object.assign({}, cfg, { closeTime: (t && t.value) || '11:50', closeEnabled: !!(en && en.checked) });
          saveConfig(cfg);
          showMessage(cfg.closeEnabled ? ('已自動儲存，結單時間：' + cfg.closeTime) : '已自動儲存，結單暫停（測試模式）');
        });
      });
      // Google Sheet 連結：停止輸入約 1.2 秒自動存
      const _su = document.getElementById('sheet-url');
      if (_su) _su.addEventListener('input', () => {
        if (sheetSaveTimer) clearTimeout(sheetSaveTimer);
        sheetSaveTimer = setTimeout(() => {
          sheetSaveTimer = null;
          if (!isConfigLoaded()) return;
          const el = document.getElementById('sheet-url');
          if (!el) return;
          cfg = Object.assign({}, cfg, { sheetUrl: el.value.trim() });

    function openAddonEdit(idx) {

    function saveAddonEdit() {
      if (!addonEdit) return;
      const name = (addonEdit.name || '').trim();
      const options = (addonEdit.options || []).map((op, i) => {
        const price = parseInt(op.price, 10);
        const orig = parseInt(op.orig, 10);
        const rec = { id: op.id || ('o' + Date.now().toString(36) + i), label: (op.label || '').trim(), price };
        if (!isNaN(orig) && orig > 0) rec.orig = orig;
        return rec;
      }).filter(op => !isNaN(op.price) && op.price >= 0);
      if (!name) { showMessage('請填寫商品名稱'); return; }
      if (!options.length) { showMessage('請至少填一組規格的售價'); return; }
      const rec = {
        id: addonEdit.id || ('addon-' + Date.now().toString(36)),
        name, img: (addonEdit.img || '').trim(), active: addonEdit.active !== false, options,
      };
      const isNew = !!addonEdit.isNew;
      const list = isNew ? addonList.concat([rec]) : addonList.map((x, i) => i === addonEdit.idx ? rec : x);
      addonEdit = null;
      commitAddons(list, isNew ? '✅ 已新增，顧客點餐頁馬上看得到' : '✅ 已儲存，顧客點餐頁馬上更新');
    }

    // ---------- 圖片上傳 ----------
    function saveCloudSettings() {
      const n = document.getElementById('cloud-name');

      cfg = Object.assign({}, cfg, {

      });

      showMessage(cloudConf().preset ? '✅ 已儲存，現在可以直接上傳圖片了' : '已儲存（尚未填上傳預設，仍只能貼網址）');
    }

    // 上傳前先縮圖：手機照片動輒 3～5MB，縮到最長邊 900px 顧客端載得快、也省 Cloudinary 空間
    function shrinkImage(file) {
      return new Promise(resolve => {
        if (!file.type || file.type.indexOf('image/') !== 0 || typeof createImageBitmap !== 'function') { resolve(file); return; }
        createImageBitmap(file).then(bmp => {
          const long = Math.max(bmp.width, bmp.height);
          const scale = Math.min(1, CLOUDINARY_MAX_PX / long);
          if (scale === 1 && file.size < 800 * 1024) { if (bmp.close) bmp.close(); resolve(file); return; }
          const w = Math.max(1, Math.round(bmp.width * scale));
          const h = Math.max(1, Math.round(bmp.height * scale));
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // 透明底轉 JPEG 會變黑，先鋪白底
          ctx.drawImage(bmp, 0, 0, w, h);
          if (bmp.close) bmp.close();
          cv.toBlob(blob => resolve(blob || file), 'image/jpeg', 0.85);
        }).catch(() => resolve(file)); // HEIC 之類瀏覽器解不開的，直接原檔上傳讓 Cloudinary 轉
      });
    }

    function uploadAddonImage(file) {
      if (!file || !addonEdit) return;
      const conf = cloudConf();
      if (!conf.preset) { showMessage('⚠️ 請先在上方「圖片上傳設定」填入 Cloudinary 的上傳預設（upload preset）'); return; }
      if (file.size > 20 * 1024 * 1024) { showMessage('⚠️ 圖片太大（超過 20MB），請先壓縮或改選別張'); return; }
      captureAddonModal(); // 先把打到一半的名稱／價格收起來，重繪才不會不見
      addonUploading = true;
      renderAdmin();
      shrinkImage(file).then(blob => {
        const fd = new FormData();
        fd.append('file', blob);
        fd.append('upload_preset', conf.preset);
        fd.append('folder', CLOUDINARY_FOLDER);
        return fetch('https://api.cloudinary.com/v1_1/' + encodeURIComponent(conf.cloud) + '/image/upload', { method: 'POST', body: fd })
          .then(res => res.json().catch(() => ({})).then(json => ({ ok: res.ok, json })));
      }).then(r => {
        if (!r.ok || !r.json || !r.json.secure_url) {
          throw new Error((r.json && r.json.error && r.json.error.message) || '上傳失敗');
        }
        addonUploading = false;
        if (addonEdit) addonEdit.img = r.json.secure_url;
        renderAdmin();
        showMessage('✅ 圖片已上傳');
      }).catch(e => {
        console.warn('圖片上傳失敗', e);
        addonUploading = false;
        renderAdmin();
        showMessage('⚠️ 圖片上傳失敗：' + (e && e.message ? e.message : '請檢查網路與上傳預設設定'));
      });
    }

    // 整份寫回雲端 config/addons（跟菜單一樣先更新本機鏡像，快照回來會再校正一次）
    function commitAddons(list, msg) {
      addonList = list;
      addonSeeded = false; // 一旦存過，就完全以後台設定為準
      const db = ensureDb();
      if (db) {
        db.collection('config').doc('addons').set({ list, updatedAt: Date.now() })
          .then(() => { if (msg) showMessage(msg); })
          .catch(e => { console.warn('附加商品儲存失敗', e); showMessage('⚠️ 雲端儲存失敗，請檢查網路或 Firestore 規則是否允許寫入 config/addons'); });
      } else {
        try { localStorage.setItem('xyg-addons', JSON.stringify(list)); } catch (e) {}
        showMessage('⚠️ 目前離線，已暫存本機；連上網後請再存一次');
      }
      renderAdmin();
    }

    function captureAnnInputs() {

    function addAnnouncement() {
      const text = (annDraft.text || '').trim();
      if (!text) { showMessage('請先輸入公告內容'); return; }
      // id 要帶隨機碼：只用時間戳的話連續新增可能撞號，之後隱藏／編輯會一次動到兩則
      const id = 'an' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    function saveAnnouncementEdit() {
      if (!annEdit) return;

      commitAnn(annList().map(x => x.id !== annEdit.id ? x : Object.assign({}, x, { text, type })));

    function updateAnnouncement(id, fn) {
      commitAnn(annList().map(x => x.id !== id ? x : fn(x)));

    function moveAnnouncement(id, dir) {
      const list = annList().slice();

      renderAdmin();
