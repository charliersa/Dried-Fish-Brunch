    // 顧客點餐頁實際看得到幾個品項（分類隱藏或品項下架都不算）
    function custCount(cat) {
      if (isHiddenForCustomer(cat)) return 0;
      return (cat.items || []).filter(it => it.active !== false).length;
    }
    // 一鍵送出到顧客點餐頁：分類設為顧客可見，並把該分類所有品項上架
    function publishCategory(catId) {
      const c = cfg.menu.find(x => x.id === catId);
      if (!c) return;
      const n = (c.items || []).length;
      if (!n) { showMessage('這個分類還沒有品項，請先新增品項'); return; }
      cfg.menu = cfg.menu.map(x => x.id !== catId ? x
        : Object.assign({}, x, { hidden: false, items: x.items.map(it => Object.assign({}, it, { active: true })) }));
      saveMenu(cfg.menu);
      showMessage('✅ 已送出，顧客現在看得到「' + c.name + '」的 ' + n + ' 個品項');
      renderAdmin();
    }
    // 切換分類是否顯示在顧客點餐頁（廚房/收銀/後台一律看得到，不受影響）
    function toggleCategoryVisible(catId) {
      const c = cfg.menu.find(x => x.id === catId);
      if (!c) return;
      const next = !isHiddenForCustomer(c); // 目前可見 → 切成隱藏，反之亦然
      cfg.menu = cfg.menu.map(x => x.id !== catId ? x : Object.assign({}, x, { hidden: next }));
      saveMenu(cfg.menu);
      showMessage(next ? '已設為顧客看不到' : '已上架到顧客點餐頁');
      renderAdmin();
    }
    function renameCategory(catId) {
      const c = cfg.menu.find(x => x.id === catId); if (!c) return;
      const name = prompt('修改大類名稱', c.name); if (name === null) return;
      const icon = prompt('修改圖示 emoji', c.icon || '🍽️'); if (icon === null) return;
      cfg.menu = cfg.menu.map(x => x.id !== catId ? x : Object.assign({}, x, { name: (name || '').trim() || x.name, icon: (icon || '').trim() || x.icon }));
      saveMenu(cfg.menu); renderAdmin();
    }
    function deleteCategory(catId) {
      const c = cfg.menu.find(x => x.id === catId); if (!c) return;
      if (!confirm(`確定刪除大類「${c.name}」？\n其下 ${c.items.length} 個品項會一併刪除。`)) return;
      cfg.menu = cfg.menu.filter(x => x.id !== catId);
      saveMenu(cfg.menu); renderAdmin();
    }
    // 位置自訂移動：大類／品項上移下移，陣列順序就是顧客點餐頁與各頁面的顯示順序
    function moveCategory(catId, dir) {
      const list = cfg.menu.slice();
      const i = list.findIndex(x => x.id === catId);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= list.length) return;
      const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      cfg.menu = list;
      saveMenu(cfg.menu); renderAdmin();
    }
    function moveItem(catId, id, dir) {
      let moved = false;
      cfg.menu = cfg.menu.map(c => {
        if (c.id !== catId) return c;
        const items = c.items.slice();
        const i = items.findIndex(x => x.id === id);
        const j = i + dir;
        if (i < 0 || j < 0 || j >= items.length) return c;
        const tmp = items[i]; items[i] = items[j]; items[j] = tmp;
        moved = true;
        return Object.assign({}, c, { items });
      });
      if (!moved) return;
      saveMenu(cfg.menu); renderAdmin();
    }
    function findItem(catId, id) { const c = cfg.menu.find(x => x.id === catId); return c ? c.items.find(i => i.id === id) : null; }
    function toggleItem(catId, id, field) {
      cfg.menu = cfg.menu.map(c => c.id !== catId ? c : Object.assign({}, c, { items: c.items.map(i => i.id !== id ? i : Object.assign({}, i, { [field]: !i[field] })) }));
      saveMenu(cfg.menu); renderAdmin();
    }
    function deleteItem(catId, id) {
      cfg.menu = cfg.menu.map(c => c.id !== catId ? c : Object.assign({}, c, { items: c.items.filter(i => i.id !== id) }));
      saveMenu(cfg.menu); renderAdmin();
    }
    // 顧客端常用的換飲料加價（後台一鍵加入）
    const DRINK_PRESETS = [{ name: '奶茶', price: 10 }, { name: '豆漿', price: 15 }, { name: '鮮奶茶', price: 35 }];
    // 菜單裡的飲料品項（大類有 temp 或名稱含「飲料」），當作後台輸入飲料名稱的建議清單
    function drinkNames() {
      const list = [];
      (cfg.menu || []).forEach(c => {
        if (!(c.temp || (c.name || '').indexOf('飲料') !== -1)) return;
        (c.items || []).forEach(it => { if (it.name && list.indexOf(it.name) === -1) list.push(it.name); });
      });
      DRINK_PRESETS.forEach(p => { if (list.indexOf(p.name) === -1) list.push(p.name); });
      return list;
    }
    // 讀取品項既有的加價選項；相容舊的 add5/add10/add15 欄位（自動轉成清單）
    function loadAddons(it) {
      let list = Array.isArray(it.addons) ? it.addons.map(a => ({ name: a.name || '', price: a.price != null ? a.price : '', drink: !!a.drink })) : [];
      if (!list.length) {
        [['5', it.add5], ['10', it.add10], ['15', it.add15]].forEach(([p, nm]) => { if (nm) list.push({ name: nm, price: parseInt(p, 10), drink: false }); });
      }
      return list;
    }
    // 重建彈窗前，先把目前輸入框的值寫回 editItem，避免新增/刪除加價列時遺失
    function captureItemModal() {
      if (!editItem) return;
      const n = document.getElementById('item-name'); if (n) editItem.name = n.value;
      const p = document.getElementById('item-price'); if (p) editItem.price = p.value;
      const o = document.getElementById('item-opts'); if (o) editItem.opts = o.value;
      const bd = document.getElementById('item-basedrink'); if (bd) editItem.baseDrink = bd.value;
      (editItem.addons || []).forEach((ad, i) => {
        const nm = document.getElementById('item-addon-name-' + i);
        const pr = document.getElementById('item-addon-price-' + i);
        if (nm) ad.name = nm.value;
        if (pr) ad.price = pr.value;
      });
    }
    // 把彈窗目前內容寫進 cfg.menu；回傳 false = 品名或價格還沒填完，不動資料
    function applyItemToMenu() {
      captureItemModal();
      const name = (editItem.name || '').trim();
      const price = parseInt(editItem.price, 10);
      if (!name || !(price >= 0)) return false;
      const opts = (editItem.opts || '').split('\n').map(s => s.trim()).filter(Boolean);
      // 只保留「有填名稱且金額為有效數字」的加價選項，空白列自動略過
      const addons = (editItem.addons || []).map(a => ({ name: (a.name || '').trim(), price: parseInt(a.price, 10), drink: !!a.drink })).filter(a => a.name && !isNaN(a.price) && a.price >= 0);
      const baseDrink = (editItem.baseDrink || '').trim();
      if (editItem.isNew) {
        const nid = 'x' + Date.now();
        editItem.id = nid;
        editItem.isNew = false; // 已建立，之後改為「更新」，避免每次自動儲存都新增一筆
        cfg.menu = cfg.menu.map(c => c.id !== editItem.catId ? c : Object.assign({}, c, { items: [...c.items, { id: nid, name, price, opts, addons, baseDrink, active: true, soldOut: false }] }));
      } else {
        cfg.menu = cfg.menu.map(c => c.id !== editItem.catId ? c : Object.assign({}, c, { items: c.items.map(i => i.id !== editItem.id ? i : Object.assign({}, i, { name, price, opts, addons, baseDrink })) }));
      }
      return true;
    }

    // ---------- 自動儲存：品名與價格都填好後，停止輸入約 1.2 秒就寫入雲端 ----------
    let autoSaveTimer = null;
    function setAutoStatus(s) {
      autoSaveStatus = s;
      const el = document.getElementById('item-autosave');
      if (el) el.textContent = s === 'saving' ? '儲存中…' : s === 'saved' ? '✓ 已自動儲存' : '';
    }
    function scheduleAutoSave() {
      captureItemModal(); // 先把輸入值收進 editItem，避免中途重繪遺失
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(autoSaveItem, 1200);
    }
    function autoSaveItem() {
      autoSaveTimer = null;
      if (!editItem) return;
      if (!isConfigLoaded()) return; // 雲端還沒載入完成，一律不寫入
      if (!applyItemToMenu()) return; // 必填欄位還沒填完，安靜等待
      editItem.autoSaved = true;
      setAutoStatus('saving');
      Promise.resolve(saveMenu(cfg.menu))
        .then(() => setAutoStatus('saved'))
        .catch(() => setAutoStatus(''));
    }

    function saveItem() {
      if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }
      if (!applyItemToMenu()) { showMessage('請填寫品名與價格'); return; }
      editItem = null; autoSaveStatus = ''; saveMenu(cfg.menu); renderAdmin();
    }

    // ---------- 營運資料操作 ----------
    function openEnt(kind, id) {
      const data = {};
      const item = id ? (cfg.ent[entListKey(kind)] || []).find(x => x.id === id) : null;
      fieldDefs(kind).forEach(d => { data[d.key] = item ? item[d.key] : ''; });
      editEnt = { kind, id: id || null, isNew: !item, data };
      renderAdmin();
    }
    // 把營運資料彈窗的內容寫進 cfg.ent；回傳 false = 第一個必填欄位還沒填
    function applyEntToCfg() {
      const defs = fieldDefs(editEnt.kind); const rec = {};
      for (const d of defs) {
        const el = document.getElementById('ent-' + d.key);
        if (!el) return false;
        let v = el.value;
        if (d.type === 'number') { v = parseFloat(v); if (isNaN(v)) v = 0; } else v = (v || '').trim();
        rec[d.key] = v;
      }
      if (!rec[defs[0].key]) return false;
      const lk = entListKey(editEnt.kind); const list = (cfg.ent[lk] || []).slice();
      if (editEnt.isNew) {
        rec.id = editEnt.kind + Date.now();
        if (editEnt.kind === 'equipment') rec.status = '正常';
        editEnt.id = rec.id;
        editEnt.isNew = false; // 已建立，之後改為「更新」，避免每次自動儲存都新增一筆
        list.push(rec);
      } else {
        const i = list.findIndex(x => x.id === editEnt.id); if (i >= 0) list[i] = Object.assign({}, list[i], rec);
      }
      cfg.ent = Object.assign({}, cfg.ent, { [lk]: list });
      return true;
    }

    // ---------- 營運資料彈窗的自動儲存 ----------
    let entSaveTimer = null;
    let sheetSaveTimer = null;
    function setEntStatus(s) {
      entAutoStatus = s;
      const el = document.getElementById('ent-autosave');
      if (el) el.textContent = s === 'saving' ? '儲存中…' : s === 'saved' ? '✓ 已自動儲存' : '';
    }
    function scheduleEntAutoSave() {
      if (entSaveTimer) clearTimeout(entSaveTimer);
      entSaveTimer = setTimeout(autoSaveEnt, 1200);
    }
    function autoSaveEnt() {
      entSaveTimer = null;
      if (!editEnt) return;
      if (!isConfigLoaded()) return; // 雲端還沒載入完成，一律不寫入
      if (!applyEntToCfg()) return;  // 必填欄位還沒填完，安靜等待
      editEnt.autoSaved = true;
      setEntStatus('saving');
      Promise.resolve(saveEnt(cfg.ent))
        .then(() => setEntStatus('saved'))
        .catch(() => setEntStatus(''));
    }

    function commitEnt() {
      if (entSaveTimer) { clearTimeout(entSaveTimer); entSaveTimer = null; }
      const defs = fieldDefs(editEnt.kind);
      if (!applyEntToCfg()) { showMessage('請填寫' + defs[0].label); return; }
      editEnt = null; entAutoStatus = ''; saveEnt(cfg.ent); renderAdmin();
    }
    function deleteEnt(kind, id) {
      const lk = entListKey(kind);
      cfg.ent = Object.assign({}, cfg.ent, { [lk]: (cfg.ent[lk] || []).filter(x => x.id !== id) });
      saveEnt(cfg.ent); renderAdmin();
    }
    function cycleStatus(id) {
      const order = ['正常', '保養中', '維修中'];
      cfg.ent = Object.assign({}, cfg.ent, { equipment: (cfg.ent.equipment || []).map(x => x.id !== id ? x : Object.assign({}, x, { status: order[(order.indexOf(x.status) + 1) % 3] })) });
      saveEnt(cfg.ent); renderAdmin();
    }
    function adjustStock(id, delta) {
      cfg.ent = Object.assign({}, cfg.ent, { ingredients: (cfg.ent.ingredients || []).map(x => x.id !== id ? x : Object.assign({}, x, { stock: Math.max(0, (x.stock || 0) + delta) })) });
      saveEnt(cfg.ent); renderAdmin();
    }

    // ---------- 啟動 ----------
    try { unlocked = localStorage.getItem(ADMIN_AUTH_KEY) === '1'; } catch (e) { unlocked = false; }
    if (unlocked) renderAdmin(); else renderLogin();

    initSync(list => {
      orders = list;
      checkNewOrders(list); // 有新訂單就響鈴提醒（不論在哪個分頁、有沒有登入畫面）
      if (unlocked && !editItem && !editEnt && !addonEdit) renderAdmin();
    });

    initConfig(c => {
      cfg = c;
      if (unlocked && !editItem && !editEnt && !addonEdit) renderAdmin();
    });

    // ---------- 附加商品同步（Firestore config/addons，離線退回本機）----------
    (function initAddonSync() {
      const db = ensureDb();
      if (!db) {
        try { addonList = JSON.parse(localStorage.getItem('xyg-addons') || '[]'); } catch (e) {}
        if (!addonList.length) { addonList = JSON.parse(JSON.stringify(DEFAULT_ADDONS)); addonSeeded = true; }
        addonLoaded = true;
        return;
      }
      db.collection('config').doc('addons').onSnapshot(
        snap => {
          const data = snap.exists ? snap.data() : null;
          if (data && Array.isArray(data.list)) {
            // 雲端已有文件 → 完全以雲端為準（就算清空也是店家自己刪的）
            addonList = data.list;
            addonSeeded = false;
          } else {
            // 雲端還沒建過這份文件 → 先顯示跟顧客端一致的預設商品，讓店家能直接編輯
            addonList = JSON.parse(JSON.stringify(DEFAULT_ADDONS));
            addonSeeded = true;
          }
          addonLoaded = true;
          if (unlocked && aTab === 'addons' && !editItem && !editEnt && !addonEdit) renderAdmin();
        },
        err => {
          console.warn('附加商品同步中斷', err);
          if (!addonList.length) { addonList = JSON.parse(JSON.stringify(DEFAULT_ADDONS)); addonSeeded = true; }
          addonLoaded = true;
          if (unlocked && aTab === 'addons') renderAdmin();
        }
      );
    })();

    // ---------- 顧客回饋同步（Firestore feedback 集合，離線退回本機）----------
    (function initFeedbackSync() {
      const db = ensureDb();
      if (db) {
        db.collection('feedback').orderBy('createdAt', 'desc').onSnapshot(
          snap => {
            feedbacks = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
            if (unlocked && aTab === 'feedback' && !editItem && !editEnt) renderAdmin();
          },
          err => {
            console.warn('回饋同步中斷，改讀本機', err);
            try { feedbacks = JSON.parse(localStorage.getItem('xyg-feedback') || '[]'); } catch (e) {}
            if (unlocked && aTab === 'feedback') renderAdmin();
          }
        );
      } else {
        try { feedbacks = JSON.parse(localStorage.getItem('xyg-feedback') || '[]'); } catch (e) {}
      }
    })();

    // ---------- 顧客端在線人數（Firestore presence 集合）----------
    if (window.xygPresence) {
      xygPresence.watch(v => { viewers = v; paintViewers(); });
    }

    function deleteFeedback(id) {
      const db = ensureDb();
      if (db) {
        db.collection('feedback').doc(String(id)).delete()
          .catch(e => console.warn('刪除回饋失敗', e));
      } else {
        feedbacks = feedbacks.filter(f => f.id !== id);
        try { localStorage.setItem('xyg-feedback', JSON.stringify(feedbacks)); } catch (e) {}
        renderAdmin();
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker failed:', err));
    }
  </script>
</body>
</html>
